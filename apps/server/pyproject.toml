[project]
name = "mcp-stateless-server"
version = "0.1.0"
description = "Deterministic MCP 2026-07-28 server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]==2.2.0",
    "pydantic>=2.11.9,<3",
    "uvicorn>=0.37.0,<1",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_stateless_server"]

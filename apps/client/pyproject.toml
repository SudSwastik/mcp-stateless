[project]
name = "mcp-stateless-client"
version = "0.1.0"
description = "Black-box MCP 2026-07-28 compatibility client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1,<3",
    "mcp==2.2.0",
]

[project.scripts]
mcp-stateless-client = "mcp_stateless_client.cli:entrypoint"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_stateless_client"]

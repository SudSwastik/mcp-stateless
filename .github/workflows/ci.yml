name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy apps
      - run: docker build --file apps/server/Dockerfile --tag mcp-stateless-server:test .
      - run: docker build --file apps/client/Dockerfile --tag mcp-stateless-client:test .
